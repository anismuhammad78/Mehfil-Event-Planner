<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeee9"/>
      <stop offset="0.45" stop-color="#eec9d3"/>
      <stop offset="1" stop-color="#6b2a55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff1cc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff1cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#3a1030" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a1030" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- warm light pools -->
  <circle cx="280" cy="760" r="420" fill="url(#glow)" opacity="0.55"/>
  <circle cx="1320" cy="300" r="380" fill="url(#glow)" opacity="0.45"/>

  <!-- golden bokeh -->
  <g fill="#ffe2a8" filter="url(#soft)">
    <circle cx="190" cy="330" r="46" opacity="0.55"/>
    <circle cx="420" cy="560" r="30" opacity="0.5"/>
    <circle cx="640" cy="820" r="58" opacity="0.4"/>
    <circle cx="880" cy="640" r="34" opacity="0.45"/>
    <circle cx="1100" cy="860" r="52" opacity="0.4"/>
    <circle cx="1460" cy="640" r="40" opacity="0.5"/>
    <circle cx="1240" cy="470" r="26" opacity="0.5"/>
    <circle cx="90" cy="900" r="36" opacity="0.45"/>
  </g>
  <g fill="#fff6e0" filter="url(#softer)">
    <circle cx="760" cy="420" r="90" opacity="0.28"/>
    <circle cx="1500" cy="880" r="110" opacity="0.25"/>
    <circle cx="140" cy="560" r="100" opacity="0.28"/>
  </g>

  <!-- mehrab arches, left and right -->
  <g fill="none" stroke="#d9a94e" stroke-linecap="round">
    <g opacity="0.42" stroke-width="2">
      <path d="M20 1000 V600 A180 180 0 0 1 380 600 V1000"/>
      <path d="M60 1000 V610 A140 140 0 0 1 340 610 V1000"/>
      <path d="M100 1000 V620 A100 100 0 0 1 300 620 V1000"/>
    </g>
    <g opacity="0.38" stroke-width="2">
      <path d="M1220 1000 V520 A190 190 0 0 1 1600 520 V1000"/>
      <path d="M1260 1000 V530 A150 150 0 0 1 1560 530 V1000"/>
      <path d="M1300 1000 V540 A110 110 0 0 1 1520 540 V1000"/>
    </g>
  </g>

  <!-- string lights -->
  <path d="M0 120 Q400 260 800 120 Q1200 260 1600 120" fill="none" stroke="#c99a3e" stroke-width="1.5" opacity="0.7"/>
  <g fill="#fff3cf">
    <circle cx="80" cy="145" r="5"/><circle cx="160" cy="165" r="5"/><circle cx="240" cy="179" r="5"/>
    <circle cx="320" cy="187" r="5"/><circle cx="400" cy="190" r="5"/><circle cx="480" cy="187" r="5"/>
    <circle cx="560" cy="179" r="5"/><circle cx="640" cy="165" r="5"/><circle cx="720" cy="145" r="5"/>
    <circle cx="880" cy="145" r="5"/><circle cx="960" cy="165" r="5"/><circle cx="1040" cy="179" r="5"/>
    <circle cx="1120" cy="187" r="5"/><circle cx="1200" cy="190" r="5"/><circle cx="1280" cy="187" r="5"/>
    <circle cx="1360" cy="179" r="5"/><circle cx="1440" cy="165" r="5"/><circle cx="1520" cy="145" r="5"/>
  </g>
  <g fill="#ffe7a8" filter="url(#soft)" opacity="0.9">
    <circle cx="80" cy="145" r="16"/><circle cx="240" cy="179" r="16"/><circle cx="400" cy="190" r="16"/>
    <circle cx="560" cy="179" r="16"/><circle cx="720" cy="145" r="16"/><circle cx="880" cy="145" r="16"/>
    <circle cx="1040" cy="179" r="16"/><circle cx="1200" cy="190" r="16"/><circle cx="1360" cy="179" r="16"/>
    <circle cx="1520" cy="145" r="16"/>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
